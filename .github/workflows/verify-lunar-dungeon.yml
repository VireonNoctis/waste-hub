name: Verify Lunar dungeon backend

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: github.event.issue.pull_request == null && contains(github.event.issue.title, '[Lunar Backend Verify]') && github.event.comment.body == 'run' && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm Rust toolchain
        run: rustup show active-toolchain

      - name: Run Rust backend tests
        run: cargo test --manifest-path lunar-dungeons/backend/Cargo.toml

      - name: Remove temporary verification workflow
        if: always()
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-lunar-dungeon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary dungeon backend verification workflow"
          git push origin HEAD:main

      - name: Close temporary verification issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
name: Expand Lunar dungeon source

on:
  push:
    paths:
      - ".github/workflows/expand-lunar-dungeons.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source and commit individual files
        run: |
          set -euo pipefail
          test -f lunar-dungeons-expanded.zip
          unzip -oq lunar-dungeons-expanded.zip
          test -f lunar-dungeons/README.md
          test -f lunar-dungeons/backend/src/main.rs
          test -f lunar-dungeons/frontend/components/dungeons/dungeon-explorer.tsx
          rm lunar-dungeons-expanded.zip

          cat > README.md <<'EOF'
          # Lunar — Explore Dungeons

          Source code for Lunar's pixel-style dungeon exploration feature.

          ## Source

          Open the lunar-dungeons directory.

          - Feature README and setup: lunar-dungeons/README.md
          - Rust backend: lunar-dungeons/backend/
          - Next.js dungeon page and API proxy: lunar-dungeons/frontend/app/
          - Three.js dungeon scene and explorer: lunar-dungeons/frontend/components/dungeons/
          - Frontend API and contracts: lunar-dungeons/frontend/lib/dungeons/

          ## Feature scope

          - Five tiers, 16 sectors per tier, and 10 chambers per sector: 800 standard stages.
          - Boss encounters and an Infinity progression after stage 800.
          - Next.js App Router frontend with a Three.js pixel-art dungeon world.
          - Rust/Axum/SQLx backend for authenticated progression and server-validated combat.
          - Rewards are intentionally left to the separate rewards integration.

          See lunar-dungeons/README.md for configuration, authentication assumptions, routes, and verification commands.
          EOF

          rm .github/workflows/expand-lunar-dungeons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Lunar dungeon source files"
          git push origin HEAD:main
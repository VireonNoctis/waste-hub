name: Expand Lunar dungeon source

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  expand:
    if: github.event.issue.pull_request == null && contains(github.event.issue.title, '[Lunar Dungeon Source Expand]') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and extract original source archive
        env:
          PAYLOAD_B64: \${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import zipfile

          payload = base64.b64decode(os.environ["PAYLOAD_B64"], validate=True)
          archive = pathlib.Path("/tmp/lunar-dungeons-source.zip")
          archive.write_bytes(payload)
          with zipfile.ZipFile(archive) as source:
              bad = source.testzip()
              if bad:
                  raise RuntimeError(f"Corrupt archive entry: {bad}")
              source.extractall(".")
          PY

          test -f lunar-dungeons/README.md
          test -f lunar-dungeons/backend/src/main.rs
          test -f lunar-dungeons/frontend/components/dungeons/dungeon-explorer.tsx
          test -f lunar-dungeons/frontend/components/dungeons/dungeon-world.tsx

      - name: Commit source files
        run: |
          set -euo pipefail
          rm -f lunar-dungeons-expanded.zip
          rm -f .github/workflows/expand-lunar-dungeons.yml

          cat > README.md <<'EOF'
          # Lunar — Explore Dungeons

          Source code for Lunar's pixel-style dungeon exploration feature.

          ## Source

          - Feature setup and integration: [lunar-dungeons/README.md](./lunar-dungeons/README.md)
          - Rust backend: [lunar-dungeons/backend](./lunar-dungeons/backend/)
          - Next.js page and API proxy: [lunar-dungeons/frontend/app](./lunar-dungeons/frontend/app/)
          - Three.js scene and explorer: [lunar-dungeons/frontend/components/dungeons](./lunar-dungeons/frontend/components/dungeons/)
          - Frontend API and contracts: [lunar-dungeons/frontend/lib/dungeons](./lunar-dungeons/frontend/lib/dungeons/)

          ## Feature scope

          - Five tiers, 16 sectors per tier, and 10 chambers per sector: 800 standard stages.
          - Boss encounters and Infinity progression after stage 800.
          - Next.js App Router frontend with a Three.js pixel-style dungeon world.
          - Rust/Axum/SQLx backend for authenticated progression and server-validated combat.
          - Rewards are intentionally left to the separate rewards integration.

          See lunar-dungeons/README.md for setup, configuration, authentication assumptions, API routes, and verification commands.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Lunar dungeon source files"
          git push origin HEAD:main

      - name: Remove trigger comment and close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
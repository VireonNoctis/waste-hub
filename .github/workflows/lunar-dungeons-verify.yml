name: Lunar dungeon verification

on:
  push:
    paths:
      - "lunar-dungeons/**"
      - ".github/workflows/lunar-dungeons-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test Rust backend
        run: cargo test --manifest-path lunar-dungeons/backend/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path lunar-dungeons/backend/Cargo.toml --all-targets -- -D warnings

  frontend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install feature dependencies
        run: npm install --no-save typescript@latest next@latest react@latest react-dom@latest @types/react@latest @types/react-dom@latest three@latest @types/three@latest @react-three/fiber@latest lucide-react@latest
      - name: Create temporary TypeScript config
        run: |
          cat > tsconfig.lunar.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["DOM", "DOM.Iterable", "ESNext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "paths": {
                "@/*": ["lunar-dungeons/frontend/*"]
              }
            },
            "include": ["lunar-dungeons/frontend/**/*.ts", "lunar-dungeons/frontend/**/*.tsx"],
            "exclude": ["node_modules"]
          }
          EOF
      - name: Type-check feature frontend
        run: npx tsc --project tsconfig.lunar.json
